<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Soft glow behind shield -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Shield outline -->
  <path d="M256 80 L400 130 L400 270 C400 350 340 410 256 440 C172 410 112 350 112 270 L112 130 Z"
        fill="url(#shield)" stroke="#a5b4fc" stroke-width="4"/>

  <!-- Inner shield darker overlay -->
  <path d="M256 110 L376 150 L376 270 C376 340 326 392 256 418 C186 392 136 340 136 270 L136 150 Z"
        fill="#12121a" fill-opacity="0.6"/>

  <!-- Neural network nodes (representing AI) -->
  <!-- Top row -->
  <circle cx="200" cy="200" r="14" fill="url(#accent)" stroke="#a5b4fc" stroke-width="2"/>
  <circle cx="312" cy="200" r="14" fill="url(#accent)" stroke="#a5b4fc" stroke-width="2"/>
  <!-- Middle node -->
  <circle cx="256" cy="270" r="18" fill="#a5b4fc" stroke="#ffffff" stroke-width="2"/>
  <!-- Bottom row -->
  <circle cx="200" cy="340" r="14" fill="url(#accent)" stroke="#a5b4fc" stroke-width="2"/>
  <circle cx="312" cy="340" r="14" fill="url(#accent)" stroke="#a5b4fc" stroke-width="2"/>

  <!-- Connecting lines -->
  <g stroke="#818cf8" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="200" y1="200" x2="256" y2="270"/>
    <line x1="312" y1="200" x2="256" y2="270"/>
    <line x1="200" y1="340" x2="256" y2="270"/>
    <line x1="312" y1="340" x2="256" y2="270"/>
    <line x1="200" y1="200" x2="312" y2="200"/>
    <line x1="200" y1="340" x2="312" y2="340"/>
  </g>

  <!-- Small indicator dot at top of shield (highlight) -->
  <circle cx="256" cy="135" r="6" fill="#ffffff" opacity="0.7"/>
</svg>
