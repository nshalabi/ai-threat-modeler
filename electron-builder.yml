appId: com.sonny.app
productName: Sonny
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
fileAssociations:
  - ext: aitm
    name: AI Threat Model
    description: AI Threat Model Project File
    role: Editor
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: resources/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
